name: Feature request
description: Suggest an improvement to the compiler, tools, or standard library.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Changes to the language itself (syntax, types, semantics) need a proposal in the `docs` repository. Use this form for tools and libraries, or to start the discussion first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is hard about it today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How could it work? Show example code if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including doing nothing.
